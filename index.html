<title>Tournée</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Outfit:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen app. Short questionnaire (one question per screen) → full-bleed coloured card per round. Single dark "night out" look. */
:root {
  color-scheme: dark;
  --night: #170f1f;
  --night-2: #241830;
  --line: #3a2a4a;
  --ink: #fbf3ea;
  --muted: #b9a8c7;
  --coral: #ff6b4a;
  --sun: #ffd23f;
  --mint: #3ee6b0;
  --rose: #ff5fa2;
  --sky: #5ab8ff;
  --lilac: #c49bff;
  --on-card: #170f1f;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---------- Questionnaire ---------- */
.screen {
  max-width: 560px;
  min-height: 100%;
  margin: 0 auto;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
.back {
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 6px 14px;
  font-weight: 800;
}
.dots { display: flex; gap: 6px; }
.dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--sun); }
.step-body { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.eyebrow {
  font-size: .78rem; font-weight: 800; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); margin: 0;
}
.q {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1; margin: 0;
  text-wrap: balance;
}
.hint { margin: 0; color: var(--muted); line-height: 1.4; }

.welcome .q { font-size: clamp(3.4rem, 17vw, 5rem); line-height: .88; }
.welcome .q span { color: var(--coral); }
.free-tag {
  align-self: flex-start;
  font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  background: var(--mint); color: var(--on-card);
  padding: 4px 10px; border-radius: 999px;
}
.stat { display: flex; gap: 10px; flex-wrap: wrap; }
.stat div {
  flex: 1 1 120px;
  border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px;
}
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .9rem; }

.options { display: flex; flex-direction: column; gap: 10px; }
.options.grid { display: grid; grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left;
  border: 2px solid var(--line);
  background: var(--night-2);
  border-radius: 18px;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 3px;
  min-width: 0;
  transition: transform .15s, background-color .15s;
}
.opt strong { font-size: 1.08rem; }
.opt span { color: var(--muted); font-size: .88rem; line-height: 1.3; }
.opt[aria-pressed="true"] { background: var(--c, var(--sun)); border-color: var(--c, var(--sun)); color: var(--on-card); }
.opt[aria-pressed="true"] span { color: var(--on-card); opacity: .75; }
.opt:active { transform: scale(.98); }

.add-row { display: flex; gap: 8px; }
.add-row input, .pair input {
  flex: 1; min-width: 0;
  background: var(--night-2);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 13px 14px;
}
.add-row input:focus, .pair input:focus { border-color: var(--sun); outline: none; }
.add-row button {
  background: var(--sun); color: var(--on-card);
  border: 0; border-radius: 14px; padding: 0 18px; font-weight: 800;
}
.pair { display: flex; flex-direction: column; gap: 10px; }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.player {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--night-2);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 6px 6px 6px 14px;
  font-weight: 600;
}
.player button { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--line); line-height: 1; }

.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--night-2);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
}
.toggle small { display: block; color: var(--muted); font-size: .88rem; }
.toggle input { width: 22px; height: 22px; accent-color: var(--mint); flex: none; }

.cta-zone { display: flex; flex-direction: column; gap: 8px; }
.error { color: var(--coral); margin: 0; font-weight: 600; min-height: 1.3em; }
.cta {
  width: 100%;
  border: 0; border-radius: 18px; padding: 18px;
  background: var(--coral); color: var(--on-card);
  font-family: var(--display); font-size: 1.25rem; letter-spacing: .02em;
}
.cta:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.cta.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); font-family: var(--body); font-weight: 800; font-size: 1rem; padding: 14px; }
.pool { margin: 0; color: var(--muted); font-size: .92rem; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Age gate ---------- */
#gate {
  position: fixed; inset: 0;
  background: rgba(10, 6, 14, .86);
  display: grid; place-items: center;
  padding: 16px; z-index: 20;
}
#gate .box {
  background: var(--night-2);
  border: 2px solid var(--rose);
  border-radius: 22px;
  padding: 22px; max-width: 380px;
  display: flex; flex-direction: column; gap: 14px;
}
#gate h3 { font-family: var(--display); font-weight: 400; margin: 0; font-size: 1.6rem; color: var(--rose); }
#gate p { margin: 0; color: var(--muted); line-height: 1.45; }
#gate .row { display: flex; gap: 8px; }
#gate button { flex: 1; border-radius: 14px; padding: 12px; font-weight: 800; border: 2px solid var(--line); background: transparent; }
#gate button.yes { background: var(--rose); border-color: var(--rose); color: var(--on-card); }

/* ---------- Play ---------- */
#play {
  position: fixed; inset: 0;
  background: var(--c, var(--coral));
  color: var(--on-card);
  display: flex; flex-direction: column;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background-color .3s ease;
  user-select: none;
}
.play-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.play-top button {
  border: 2px solid var(--on-card); background: transparent; color: var(--on-card);
  border-radius: 999px; padding: 6px 14px; font-weight: 800;
}
.counter { font-weight: 800; font-variant-numeric: tabular-nums; opacity: .7; }
.card {
  flex: 1;
  display: flex; flex-direction: column; justify-content: center; gap: 18px;
  max-width: 640px; width: 100%; margin: 0 auto; min-height: 0;
  cursor: pointer;
}
.card .label { font-size: .8rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.card .target { font-family: var(--display); font-size: clamp(1.7rem, 7.5vw, 2.5rem); line-height: 1; margin: 0; overflow-wrap: anywhere; }
.card .text {
  font-size: clamp(1.45rem, 6.2vw, 2.15rem);
  font-weight: 800; line-height: 1.2; margin: 0;
  text-wrap: balance; overflow-wrap: anywhere;
}
.card .rule { margin: 0; font-weight: 600; opacity: .72; font-size: 1rem; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices div {
  border: 3px solid var(--on-card); border-radius: 18px; padding: 16px;
  font-weight: 800; font-size: clamp(1.1rem, 4.8vw, 1.35rem); line-height: 1.25;
}
.choices .or { border: 0; padding: 0; text-align: center; font-family: var(--display); font-weight: 400; font-size: 1rem; }
.next {
  border: 0; border-radius: 18px;
  background: var(--on-card); color: var(--c);
  padding: 18px;
  font-family: var(--display); font-size: 1.2rem;
  max-width: 640px; width: 100%; margin: 0 auto;
}
@keyframes pop { from { transform: translateY(14px) scale(.98); opacity: .2; } to { transform: none; opacity: 1; } }
.card.enter { animation: pop .28s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .card.enter { animation: none; }
  #play { transition: none; }
}
@media (max-width: 380px) { .options.grid { grid-template-columns: 1fr; } }
</style>

<main id="setup" class="screen">
  <div class="topbar">
    <button type="button" class="back" id="back">← Retour</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
  <div class="step-body" id="step"></div>
  <div class="cta-zone">
    <p class="error" id="error" role="status"></p>
    <p class="pool" id="pool"></p>
    <button type="button" class="cta" id="cta">Continuer</button>
    <button type="button" class="cta ghost" id="cta2" hidden></button>
  </div>
</main>

<div id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="box">
    <h3 id="gate-title">Réservé aux 18 ans et plus</h3>
    <p>Vous avez choisi du contenu osé. Tout le monde autour de la table doit être majeur et d'accord. Personne n'est obligé de répondre ni de faire une action : on peut toujours refuser et prendre sa pénalité.</p>
    <div class="row">
      <button type="button" id="gate-no">Retour</button>
      <button type="button" class="yes" id="gate-yes">On est tous majeurs</button>
    </div>
  </div>
</div>

<div id="play" hidden>
  <div class="play-top">
    <button type="button" id="quit">← Menu</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="card" id="card" aria-live="polite"></div>
  <button type="button" class="next" id="next">Suivant</button>
</div>

<script src="cards.js"></script>
<script>
// ---------- Base de cartes ----------
const TYPES = {
  J: { name: "Je n'ai jamais", color: "var(--coral)", weight: 22, groups: "pnc",
       rule: "Ceux qui l'ont déjà fait prennent {s1}.", ruleC: "Si tu l'as déjà fait, prends {s1}. Pareil pour {B}." },
  Q: { name: "Qui de nous", color: "var(--mint)", weight: 20, groups: "pnc",
       rule: "À 3, tout le monde pointe quelqu'un. Chaque doigt pointé sur toi = {s1}.",
       ruleC: "Pointez en même temps. Même personne désignée ? Elle prend {s2}. Sinon, {s1} chacun." },
  P: { name: "Tu préfères", color: "var(--sky)", weight: 13, groups: "pnc",
       rule: "Tout le monde choisit en même temps. Les moins nombreux prennent {s1}.",
       ruleC: "Choisissez en même temps. Pas le même choix ? {s1} chacun." },
  V: { name: "Vérité", color: "var(--sun)", weight: 15, groups: "pnc", target: true, rule: "Réponds franchement ou prends {s3}." },
  A: { name: "Action", color: "var(--rose)", weight: 14, groups: "pnc", target: true, rule: "Fais-le ou prends {s3}." },
  D: { name: "Tout le monde", color: "var(--lilac)", weight: 8, groups: "pn" },
  R: { name: "Nouvelle règle", color: "var(--ink)", weight: 4, groups: "pn" },
  T: { name: "Thème", color: "var(--sun)", weight: 4, groups: "pnc",
       rule: "Chacun son tour, en commençant par {A}. Le premier qui sèche ou répète prend {s2}." },
};
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
const CARDS = window.TOURNEE_CARDS.trim().split("\n").filter(l => /^[A-Z]\|/.test(l)).map(l => {
  const [type, topics, lvl, groups, ...rest] = l.split("|");
  const text = rest.join("|").trim();
  return { id: hash(l), type, topics: topics.split(""), lvl: +lvl, groups: groups || TYPES[type].groups, text };
});

const GROUPS = [
  { id: "p", name: "Entre potes", desc: "On se connaît par cœur, on peut tout se dire.", c: "var(--coral)" },
  { id: "n", name: "Nouvelles têtes", desc: "Des gens qu'on connaît peu. Parfait pour briser la glace.", c: "var(--sky)" },
  { id: "c", name: "En couple, à deux", desc: "Juste vous deux, pour pimenter la soirée.", c: "var(--rose)" },
];
const TOPICS = [
  { id: "s", name: "Soirée", desc: "Cuites, afters et hontes du lendemain", c: "var(--sun)" },
  { id: "x", name: "Sexe", desc: "Coquin, cash, 18 ans et plus", c: "var(--rose)" },
  { id: "a", name: "Love & ex", desc: "Crushs, ruptures et rencards ratés", c: "var(--coral)" },
  { id: "d", name: "Dossiers", desc: "Secrets, mensonges et potins", c: "var(--lilac)" },
  { id: "t", name: "Téléphone", desc: "Stalk, DM et captures d'écran", c: "var(--sky)" },
  { id: "f", name: "Délires", desc: "Absurde, défis et fous rires", c: "var(--mint)" },
];
const LEVELS = [
  { id: 1, name: "Tranquille", desc: "Drôle mais sage. On peut jouer avec n'importe qui.", c: "var(--mint)" },
  { id: 2, name: "Osé", desc: "Ça pique. Des questions qu'on n'ose pas poser à jeun.", c: "var(--sun)" },
  { id: 3, name: "Sans filtre", desc: "Tout est permis. Âmes sensibles s'abstenir.", c: "var(--rose)" },
];

// ---------- État ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("tournee:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tournee:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  group: store.get("group", "p"),
  players: store.get("players", []),
  couple: store.get("couple", ["", ""]),
  topics: store.get("topics", ["s", "a", "f"]),
  level: store.get("level", 2),
  sober: store.get("sober", false),
  adultOk: false,
};
let seen = new Set(store.get("seen", []));
const save = () => ["group", "players", "couple", "topics", "level", "sober"].forEach(k => store.set(k, state[k]));
const roster = () => state.group === "c" ? state.couple.map(s => s.trim()).filter(Boolean) : state.players;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pool() {
  return CARDS.filter(c =>
    c.lvl <= state.level &&
    c.groups.includes(state.group) &&
    c.topics.some(t => state.topics.includes(t)) &&
    (!c.topics.includes("x") || state.topics.includes("x")));
}

// ---------- Questionnaire ----------
const STEPS = ["welcome", "group", "players", "topics", "level"];
let step = 0;

function opt(o, pressed, attr) {
  return `<button type="button" class="opt" style="--c:${o.c}" ${attr}="${o.id}" aria-pressed="${pressed}"><strong>${o.name}</strong><span>${o.desc}</span></button>`;
}

function render() {
  const name = STEPS[step];
  $("setup").classList.toggle("welcome", name === "welcome");
  $("back").style.visibility = step ? "visible" : "hidden";
  $("dots").innerHTML = step ? STEPS.slice(1).map((_, i) => `<i class="${i < step ? "on" : ""}"></i>`).join("") : "";
  $("cta2").hidden = true;
  $("pool").textContent = "";
  const el = $("step");

  if (name === "welcome") {
    el.innerHTML = `
      <span class="free-tag">Gratuit · sans pub · sans compte</span>
      <h1 class="q">Tour<span>née</span></h1>
      <p class="hint">Le jeu de soirée qui pose les vraies questions. Répondez à trois questions et on vous prépare une partie sur mesure.</p>
      <div class="stat">
        <div><b>${CARDS.length}</b><span>cartes différentes</span></div>
        <div><b>8</b><span>types de jeux mélangés</span></div>
      </div>`;
    $("cta").textContent = "Commencer";
    if (store.get("played", false) && roster().length >= 2) {
      $("cta2").hidden = false;
      $("cta2").textContent = "Rejouer avec les mêmes réglages";
    }
  }

  if (name === "group") {
    el.innerHTML = `<p class="eyebrow">Question 1</p><h2 class="q">Vous jouez avec qui ?</h2>
      <div class="options" id="opts">${GROUPS.map(g => opt(g, state.group === g.id, "data-group")).join("")}</div>`;
    $("cta").textContent = "Continuer";
  }

  if (name === "players") {
    if (state.group === "c") {
      el.innerHTML = `<p class="eyebrow">Question 2</p><h2 class="q">Vos prénoms ?</h2>
        <div class="pair">
          <input id="c0" type="text" maxlength="18" placeholder="Ton prénom" aria-label="Ton prénom" value="${esc(state.couple[0])}">
          <input id="c1" type="text" maxlength="18" placeholder="Son prénom" aria-label="Le prénom de ta moitié" value="${esc(state.couple[1])}">
        </div>`;
      el.querySelectorAll("input").forEach((inp, i) => inp.addEventListener("input", () => { state.couple[i] = inp.value; save(); validate(); }));
    } else {
      el.innerHTML = `<p class="eyebrow">Question 2</p><h2 class="q">Qui joue ?</h2>
        <form class="add-row" id="add-form">
          <input id="player-input" type="text" maxlength="18" placeholder="Prénom" autocomplete="off" aria-label="Prénom du joueur">
          <button type="submit">Ajouter</button>
        </form>
        <div class="players" id="players"></div>
        <p class="hint">Les cartes vous appellent par vos prénoms. Minimum 2 joueurs.</p>`;
      $("add-form").addEventListener("submit", addPlayer);
      renderPlayers();
    }
    $("cta").textContent = "Continuer";
  }

  if (name === "topics") {
    el.innerHTML = `<p class="eyebrow">Question 3</p><h2 class="q">Vous voulez parler de quoi ?</h2>
      <p class="hint">Choisissez autant de sujets que vous voulez.</p>
      <div class="options grid" id="opts">${TOPICS.map(t => opt(t, state.topics.includes(t.id), "data-topic")).join("")}</div>`;
    $("cta").textContent = "Continuer";
  }

  if (name === "level") {
    el.innerHTML = `<p class="eyebrow">Dernière question</p><h2 class="q">On va jusqu'où ?</h2>
      <div class="options" id="opts">${LEVELS.map(l => opt(l, state.level === l.id, "data-level")).join("")}</div>
      <label class="toggle" for="sober"><span>Sans alcool<small>Les gorgées deviennent des points de pénalité. Décidez avant ce que vaut un point : pompes, gage…</small></span><input type="checkbox" id="sober" ${state.sober ? "checked" : ""}></label>`;
    $("sober").addEventListener("change", e => { state.sober = e.target.checked; save(); });
    $("cta").textContent = "Lancer la partie";
  }
  validate();
}

$("step").addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (b?.dataset.group) { state.group = b.dataset.group; }
  else if (b?.dataset.topic) {
    const t = b.dataset.topic;
    state.topics = state.topics.includes(t) ? state.topics.filter(x => x !== t) : [...state.topics, t];
    if (t === "x" && state.topics.includes("x") && state.level < 2) state.level = 2;
  }
  else if (b?.dataset.level) { state.level = +b.dataset.level; }
  else {
    const rm = e.target.closest("button[data-i]");
    if (rm) { state.players.splice(+rm.dataset.i, 1); save(); renderPlayers(); }
    return;
  }
  save(); render();
});

function renderPlayers() {
  $("players").innerHTML = state.players.map((p, i) =>
    `<span class="player">${esc(p)}<button type="button" data-i="${i}" aria-label="Retirer ${esc(p)}">×</button></span>`).join("");
  validate();
}
function addPlayer(e) {
  e.preventDefault();
  const inp = $("player-input");
  const v = inp.value.trim().replace(/\s+/g, " ");
  if (!v) return;
  if (state.players.some(p => p.toLowerCase() === v.toLowerCase())) { $("error").textContent = `${v} joue déjà.`; return; }
  state.players.push(v);
  inp.value = ""; inp.focus();
  save(); renderPlayers();
}

function validate() {
  const name = STEPS[step];
  let msg = "";
  if (name === "players") {
    const r = roster();
    if (state.group === "c" && r.length < 2) msg = "Entrez vos deux prénoms.";
    else if (r.length < 2) msg = "Ajoutez au moins 2 joueurs.";
    else if (new Set(r.map(p => p.toLowerCase())).size < r.length) msg = "Deux joueurs ont le même prénom.";
  }
  if (name === "topics" && !state.topics.length) msg = "Choisissez au moins un sujet.";
  if (name === "topics" || name === "level") {
    const n = pool().length;
    if (state.topics.length) $("pool").textContent = `${n} cartes pour votre partie`;
  }
  $("error").textContent = msg;
  $("cta").disabled = !!msg;
}

$("cta").addEventListener("click", () => {
  if (step < STEPS.length - 1) { step++; render(); window.scrollTo(0, 0); return; }
  launch();
});
$("cta2").addEventListener("click", launch);
$("back").addEventListener("click", () => { if (step) { step--; render(); } });

function launch() {
  const adult = state.topics.includes("x") || state.level === 3;
  if (adult && !state.adultOk) { $("gate").hidden = false; $("gate-yes").focus(); return; }
  startGame();
}
$("gate-yes").addEventListener("click", () => { state.adultOk = true; $("gate").hidden = true; startGame(); });
$("gate-no").addEventListener("click", () => { $("gate").hidden = true; });

// ---------- Partie ----------
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let decks = {}, round = 0, turn = 0, lastType = null, wakeLock = null;

// Les cartes jamais vues passent en premier, même d'une soirée à l'autre.
function buildDecks() {
  decks = {};
  for (const c of pool()) (decks[c.type] ||= []).push(c);
  for (const t in decks) {
    const fresh = decks[t].filter(c => !seen.has(c.id)), old = decks[t].filter(c => seen.has(c.id));
    if (!fresh.length) old.forEach(c => seen.delete(c.id));
    decks[t] = [...shuffle(old), ...shuffle(fresh)]; // pop() prend la fin : les nouvelles d'abord
  }
}
function pickType() {
  const types = Object.keys(decks).filter(t => decks[t].length && (t !== lastType || Object.keys(decks).length === 1));
  if (!types.length) { buildDecks(); return pickType(); }
  let r = Math.random() * types.reduce((s, t) => s + TYPES[t].weight, 0);
  for (const t of types) { r -= TYPES[t].weight; if (r <= 0) return t; }
  return types[0];
}
function fill(text, A, B) {
  return text
    .replace(/\{A\}/g, A).replace(/\{B\}/g, B)
    .replace(/\{s(\d)\}/g, (_, n) => state.sober ? `${n} point${n > 1 ? "s" : ""}` : `${n} gorgée${n > 1 ? "s" : ""}`);
}

function nextCard() {
  const players = roster();
  const type = pickType();
  lastType = type;
  const card = decks[type].pop();
  seen.add(card.id);
  store.set("seen", [...seen]);
  round++;

  const A = players[turn % players.length];
  const others = players.filter(p => p !== A);
  const B = others[Math.floor(Math.random() * others.length)];
  turn++;

  const T = TYPES[type];
  const couple = state.group === "c";
  const f = s => fill(esc(s), esc(A), esc(B));
  let text = card.text;
  if (type === "Q" && couple) text = text.replace(/^Qui de nous/, "Qui de nous deux");

  let html = `<span class="label">${T.name}</span>`;
  if (T.target) html += `<p class="target">${esc(A)}</p>`;
  if (type === "P") {
    const [x, y] = text.split(" // ");
    html += `<p class="text">Tu préfères…</p><div class="choices"><div>${f(x)}</div><span class="or">ou</span><div>${f(y)}</div></div>`;
  } else {
    html += `<p class="text">${f(text)}</p>`;
  }
  const rule = (couple && T.ruleC) || T.rule;
  if (rule) html += `<p class="rule">${f(rule)}</p>`;

  $("play").style.setProperty("--c", T.color);
  $("counter").textContent = `Tour ${round}`;
  const el = $("card");
  el.innerHTML = html;
  el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
}

async function startGame() {
  store.set("played", true);
  buildDecks();
  round = 0; lastType = null;
  turn = Math.floor(Math.random() * roster().length);
  $("setup").hidden = true; $("play").hidden = false;
  nextCard();
  $("next").focus();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
function quitGame() {
  $("play").hidden = true; $("setup").hidden = false;
  step = 0; render();
  try { wakeLock?.release(); } catch {}
  wakeLock = null;
}
$("next").addEventListener("click", nextCard);
$("card").addEventListener("click", nextCard);
$("quit").addEventListener("click", quitGame);

render();
</script>
